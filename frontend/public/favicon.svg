<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e0c2b" />
      <stop offset="100%" stop-color="#110619" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff79e7" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#bd79ff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#5ddfff" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="eviGrad" x1="8" y1="10" x2="56" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff79e7" />
      <stop offset="55%" stop-color="#d879ff" />
      <stop offset="100%" stop-color="#bd79ff" />
    </linearGradient>
    <linearGradient id="docsGrad" x1="6" y1="34" x2="58" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c8cff" />
      <stop offset="50%" stop-color="#68b6ff" />
      <stop offset="100%" stop-color="#5ddfff" />
    </linearGradient>
    <filter id="glowEvi" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.2" flood-color="#ff79e7" flood-opacity="0.45" />
    </filter>
    <filter id="glowDocs" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#5ddfff" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Fundo arredondado no tom escuro do EviDocs -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Parte 1 da marca: Evi (Rosa -> Violeta) -->
  <text
    x="32"
    y="30"
    text-anchor="middle"
    fill="url(#eviGrad)"
    filter="url(#glowEvi)"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
    font-size="27"
    font-weight="900"
    letter-spacing="-0.8"
  >Evi</text>

  <!-- Parte 2 da marca: Docs (Azul -> Ciano) -->
  <text
    x="32"
    y="51"
    text-anchor="middle"
    fill="url(#docsGrad)"
    filter="url(#glowDocs)"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
    font-size="21.5"
    font-weight="800"
    letter-spacing="-0.6"
  >Docs</text>
</svg>
